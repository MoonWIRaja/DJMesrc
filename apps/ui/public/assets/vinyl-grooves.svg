<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" fill="none">
  <defs>
    <radialGradient id="vinyl-face" cx="34%" cy="27%" r="78%">
      <stop offset="0" stop-color="#3b3e3c"/>
      <stop offset=".22" stop-color="#272a28"/>
      <stop offset=".48" stop-color="#101211"/>
      <stop offset=".73" stop-color="#191c1a"/>
      <stop offset="1" stop-color="#080a09"/>
    </radialGradient>
    <radialGradient id="vinyl-lacquer" cx="29%" cy="20%" r="84%">
      <stop offset="0" stop-color="#fff" stop-opacity=".13"/>
      <stop offset=".28" stop-color="#fff" stop-opacity=".025"/>
      <stop offset=".49" stop-color="#000" stop-opacity=".07"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".035"/>
      <stop offset="1" stop-color="#000" stop-opacity=".17"/>
    </radialGradient>
    <linearGradient id="vinyl-edge" x1="44" y1="52" x2="278" y2="276" gradientUnits="userSpaceOnUse">
      <stop stop-color="#858985"/>
      <stop offset=".12" stop-color="#303432"/>
      <stop offset=".48" stop-color="#090b0a"/>
      <stop offset=".78" stop-color="#4a4e4b"/>
      <stop offset="1" stop-color="#171a18"/>
    </linearGradient>
    <linearGradient id="groove-light" x1="46" y1="54" x2="270" y2="268" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".32"/>
      <stop offset=".42" stop-color="#fff" stop-opacity=".025"/>
      <stop offset=".68" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".015"/>
    </linearGradient>
    <filter id="platter-shadow" x="-12%" y="-12%" width="124%" height="132%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="disc-clip"><circle cx="160" cy="157" r="151"/></clipPath>
  </defs>

  <!-- Heavy platter lip and the pressed vinyl edge. -->
  <circle cx="160" cy="157" r="155" fill="#e1e5dd" stroke="#c3cbc0" stroke-width="1.5"/>
  <circle cx="160" cy="157" r="151.5" fill="url(#vinyl-edge)" stroke="#272c29" stroke-width="1.5" filter="url(#platter-shadow)"/>
  <circle cx="160" cy="157" r="146" fill="url(#vinyl-face)" stroke="#070908" stroke-width="1"/>

  <!-- Fine concentric pressed grooves; alternating highlights read as lacquer under studio light. -->
  <g clip-path="url(#disc-clip)" fill="none" stroke-width=".8">
    <circle cx="160" cy="157" r="48" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="160" cy="157" r="51" stroke="#000" stroke-opacity=".5"/>
    <circle cx="160" cy="157" r="54" stroke="#d4d8d4" stroke-opacity=".1"/>
    <circle cx="160" cy="157" r="57" stroke="#000" stroke-opacity=".56"/>
    <circle cx="160" cy="157" r="60" stroke="#fff" stroke-opacity=".1"/>
    <circle cx="160" cy="157" r="63" stroke="#000" stroke-opacity=".58"/>
    <circle cx="160" cy="157" r="66" stroke="#dce0dc" stroke-opacity=".1"/>
    <circle cx="160" cy="157" r="69" stroke="#000" stroke-opacity=".58"/>
    <circle cx="160" cy="157" r="72" stroke="#fff" stroke-opacity=".095"/>
    <circle cx="160" cy="157" r="75" stroke="#000" stroke-opacity=".6"/>
    <circle cx="160" cy="157" r="78" stroke="#d4d8d4" stroke-opacity=".095"/>
    <circle cx="160" cy="157" r="81" stroke="#000" stroke-opacity=".6"/>
    <circle cx="160" cy="157" r="84" stroke="#fff" stroke-opacity=".09"/>
    <circle cx="160" cy="157" r="87" stroke="#000" stroke-opacity=".62"/>
    <circle cx="160" cy="157" r="90" stroke="#dce0dc" stroke-opacity=".09"/>
    <circle cx="160" cy="157" r="93" stroke="#000" stroke-opacity=".62"/>
    <circle cx="160" cy="157" r="96" stroke="#fff" stroke-opacity=".085"/>
    <circle cx="160" cy="157" r="99" stroke="#000" stroke-opacity=".64"/>
    <circle cx="160" cy="157" r="102" stroke="#d4d8d4" stroke-opacity=".085"/>
    <circle cx="160" cy="157" r="105" stroke="#000" stroke-opacity=".64"/>
    <circle cx="160" cy="157" r="108" stroke="#fff" stroke-opacity=".08"/>
    <circle cx="160" cy="157" r="111" stroke="#000" stroke-opacity=".66"/>
    <circle cx="160" cy="157" r="114" stroke="#dce0dc" stroke-opacity=".08"/>
    <circle cx="160" cy="157" r="117" stroke="#000" stroke-opacity=".66"/>
    <circle cx="160" cy="157" r="120" stroke="#fff" stroke-opacity=".075"/>
    <circle cx="160" cy="157" r="123" stroke="#000" stroke-opacity=".68"/>
    <circle cx="160" cy="157" r="126" stroke="#d4d8d4" stroke-opacity=".075"/>
    <circle cx="160" cy="157" r="129" stroke="#000" stroke-opacity=".68"/>
    <circle cx="160" cy="157" r="132" stroke="#fff" stroke-opacity=".07"/>
    <circle cx="160" cy="157" r="135" stroke="#000" stroke-opacity=".7"/>
    <circle cx="160" cy="157" r="138" stroke="#dce0dc" stroke-opacity=".07"/>
    <circle cx="160" cy="157" r="141" stroke="#000" stroke-opacity=".72"/>
    <circle cx="160" cy="157" r="144" stroke="#fff" stroke-opacity=".085"/>
  </g>

  <!-- Broad lacquer reflections add depth without competing with the deck label. -->
  <circle cx="160" cy="157" r="146" fill="url(#vinyl-lacquer)"/>
  <circle cx="160" cy="157" r="142" stroke="url(#groove-light)" stroke-width="1.3"/>
  <!-- Moving groove reflections break the concentric symmetry so rotation reads at platter size. -->
  <path d="M 220 53 A 120 120 0 0 1 270 103" fill="none" stroke="#f4f7f2" stroke-opacity=".45" stroke-width="5" stroke-linecap="round"/>
  <path d="M 214 58 A 112 112 0 0 1 258 103" fill="none" stroke="#e6ebe4" stroke-opacity=".28" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 257 69 A 134 134 0 0 1 284 110" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2" stroke-linecap="round"/>
  <circle cx="160" cy="157" r="46" stroke="#070908" stroke-opacity=".7" stroke-width="1"/>
  <circle cx="160" cy="157" r="42" stroke="#fff" stroke-opacity=".12" stroke-width=".8"/>
  <circle cx="160" cy="157" r="5" fill="#070908" stroke="#a5aaa6" stroke-opacity=".7" stroke-width=".8"/>
</svg>
